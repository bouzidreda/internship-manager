services:
  postgres:
    image: postgres:16-alpine
    container_name: stage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stage_management
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stage_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: stage-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: stage_management
      JWT_SECRET: super_secret_key_change_me
      JWT_EXPIRES_IN: 1d
      FRONTEND_URL: http://localhost:${FRONTEND_HOST_PORT:-8081}
      APP_PUBLIC_URL: http://localhost:${FRONTEND_HOST_PORT:-8081}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: stage-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-8081}:80"
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_AI_ASSISTANT_ENABLED=true
      - N8N_AI_WORKFLOW_BUILDER_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  postgres_data:
  n8n_data: